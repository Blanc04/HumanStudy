<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>채용 공고</title>

    <link rel="stylesheet" href="assets/css/job_board.css">
</head>

<body>

    <!-- =========================
         상단 헤더
    ========================== -->
    <header class="header">

        <div class="header-left">

            <a href="/" class="logo">
                &lt;로고 삽입&gt;
            </a>

            <nav class="nav">
                <a href="/notice">공지사항</a>
                <a href="/jobs" class="active">채용 공고</a>
                <a href="/tips">취업 꿀팁</a>
            </nav>

        </div>


        <div class="header-right">

            <div class="mypage">

                <a href="/mypage" class="mypage-title">
                    마이페이지
                </a>

                <div class="mypage-info">
                    <span>관리자 페이지</span>
                    <small>홍길동님 환영합니다</small>
                </div>

            </div>

            <a href="/logout" class="logout-button">
                로그아웃
            </a>

        </div>

    </header>



    <!-- =========================
         메인
    ========================== -->
    <main class="main">

        <!-- 제목 -->
        <section class="page-header">

            <h1>
                채용 공고
            </h1>

            <p>
                다양한 기업의 채용 정보를 확인해보세요
            </p>

        </section>



        <!-- 검색 -->
        <section class="search-section">

            <form class="search-form" method="get" action="/jobs">

                <select name="type">
                    <option value="title">제목</option>
                    <option value="writer">글쓴이</option>
                </select>

                <input
                    type="search"
                    name="keyword"
                    placeholder="원하는 채용 공고를 검색해보세요"
                >

                <button type="submit">
                    🔍 검색
                </button>

            </form>

        </section>



        <!-- 게시판 -->
        <section class="board-section">

            <!-- 상단 정보 -->
            <div class="board-top">

                <div class="board-count">
                    총 <strong>138</strong>개의 공고가 있습니다
                </div>

                <select class="page-size">
                    <option>10개씩 보기</option>
                    <option>20개씩 보기</option>
                    <option>30개씩 보기</option>
                </select>

            </div>



            <!-- 목록 -->
            <table class="board-table">

                <thead>

                    <tr>
                        <th class="number">번호</th>
                        <th class="title">제목</th>
                        <th class="writer">글쓴이</th>
                        <th class="date">날짜</th>
                    </tr>

                </thead>


                <tbody>

                    <tr>

                        <td>
                            11
                        </td>

                        <td class="title">

                            <a href="/jobs/11">
                                삼성 경비원 채용
                            </a>

                            <span class="new-badge">
                                NEW
                            </span>

                        </td>

                        <td>
                            이재용
                        </td>

                        <td>
                            2026-10-02
                        </td>

                    </tr>



                    <tr>

                        <td>
                            12
                        </td>

                        <td class="title">

                            <a href="/jobs/12">
                                넥슨 프로그래머 모집
                            </a>

                        </td>

                        <td>
                            김창섭
                        </td>

                        <td>
                            2026-10-01
                        </td>

                    </tr>



                    <tr>

                        <td>
                            5
                        </td>

                        <td class="title">

                            <a href="/jobs/5">
                                해외기업 개발자 채용공고
                            </a>

                        </td>

                        <td>
                            게이브
                        </td>

                        <td>
                            2026-09-30
                        </td>

                    </tr>



                    <tr>

                        <td>
                            7
                        </td>

                        <td class="title">

                            <a href="/jobs/7">
                                AI 서비스 개발자 채용
                            </a>

                        </td>

                        <td>
                            admin
                        </td>

                        <td>
                            2026-09-29
                        </td>

                    </tr>



                    <tr>

                        <td>
                            6
                        </td>

                        <td class="title">

                            <a href="/jobs/6">
                                프론트엔드 개발자 모집
                            </a>

                        </td>

                        <td>
                            admin
                        </td>

                        <td>
                            2026-09-28
                        </td>

                    </tr>

                </tbody>

            </table>



            <!-- 페이지네이션 -->
            <nav class="pagination">

                <a href="?page=1" class="arrow">
                    ‹
                </a>

                <a href="?page=1" class="active">
                    1
                </a>

                <a href="?page=2">
                    2
                </a>

                <a href="?page=3">
                    3
                </a>

                <a href="?page=4">
                    4
                </a>

                <a href="?page=5">
                    5
                </a>

                <a href="?page=2" class="arrow">
                    ›
                </a>

            </nav>

        </section>

    </main>

</body>
</html>
