<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>upload</title>
</head>
<body>
    <h1>파일 업로드 실습</h1>
    <!-- 
        파일 업로드
        method는 무조건 post 
    -->
    <form method="post" action="http://127.0.0.1:8000/upload" enctype="multipart/form-data">
        제목 : <input type="text" name="title"><br>
        내용<br>
        <textarea name="content"></textarea>
        <br>
        파일 첨부1 : <input type="file" name="file1">
        <br>
        파일 첨부2 : <input type="file" name="file2" multiple>
        <br>
        <input type="submit" value="전송">
    </form>
    <img src="http://127.0.0.1:8000/download?file_name=ea487a05ce74481e8703d4554e1d009e_emp dept 연습.png"
</body>
</html>
